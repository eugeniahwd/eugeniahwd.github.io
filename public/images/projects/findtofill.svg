<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1330"/>
      <stop offset="1" stop-color="#070a17"/>
    </linearGradient>
    <radialGradient id="g1" cx=".2" cy=".2" r=".6">
      <stop offset="0" stop-color="#1f3370" stop-opacity=".7"/>
      <stop offset="1" stop-color="#1f3370" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx=".95" cy=".9" r=".55">
      <stop offset="0" stop-color="#415A77" stop-opacity=".45"/>
      <stop offset="1" stop-color="#415A77" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e36a82"/>
      <stop offset="1" stop-color="#7a1428"/>
    </linearGradient>
    <radialGradient id="radar" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#e36a82" stop-opacity=".35"/>
      <stop offset="1" stop-color="#e36a82" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#000" flood-opacity=".6"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#g1)"/>
  <rect width="1200" height="750" fill="url(#g2)"/>

  <!-- city blocks -->
  <g fill="#ffffff" fill-opacity=".025">
    <rect x="40" y="40" width="160" height="110" rx="8"/><rect x="230" y="40" width="120" height="110" rx="8"/>
    <rect x="380" y="40" width="200" height="110" rx="8"/><rect x="40" y="420" width="140" height="150" rx="8"/>
    <rect x="210" y="470" width="180" height="100" rx="8"/><rect x="420" y="520" width="150" height="190" rx="8"/>
    <rect x="40" y="600" width="140" height="110" rx="8"/><rect x="600" y="40" width="130" height="90" rx="8"/>
  </g>
  <g stroke="#7f95d8" stroke-opacity=".12" stroke-width="3" fill="none">
    <path d="M0 180H760M0 400H760M215 0V750M600 0V750M0 590L760 520"/>
    <path d="M380 0L320 750" stroke-width="2"/>
  </g>

  <!-- KRL line -->
  <path d="M-20 640C140 600 200 470 300 400S480 300 560 250 700 140 780 60" fill="none" stroke="#c23a55" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M-20 640C140 600 200 470 300 400S480 300 560 250 700 140 780 60" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="2" stroke-dasharray="10 12"/>

  <!-- radar around user -->
  <circle cx="300" cy="400" r="120" fill="url(#radar)"/>
  <circle cx="300" cy="400" r="80" fill="none" stroke="#e36a82" stroke-opacity=".35"/>
  <circle cx="300" cy="400" r="120" fill="none" stroke="#e36a82" stroke-opacity=".18"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <!-- stations -->
    <g>
      <circle cx="140" cy="590" r="12" fill="#0a1330" stroke="#fff" stroke-width="4"/>
      <circle cx="300" cy="400" r="14" fill="#0a1330" stroke="#fff" stroke-width="4"/>
      <circle cx="560" cy="250" r="12" fill="#0a1330" stroke="#fff" stroke-width="4"/>
      <circle cx="730" cy="105" r="12" fill="#0a1330" stroke="#fff" stroke-width="4"/>
      <text x="160" y="625" fill="#efe9e2" fill-opacity=".8" font-size="15" font-weight="600">Station A</text>
      <text x="326" y="436" fill="#efe9e2" font-size="16" font-weight="700">You are here</text>
      <text x="580" y="285" fill="#efe9e2" fill-opacity=".8" font-size="15" font-weight="600">Station C</text>
      <text x="610" y="92" fill="#efe9e2" fill-opacity=".8" font-size="15" font-weight="600">Station D</text>
    </g>

    <!-- pins: water -->
    <g transform="translate(420 300)" filter="url(#sh)">
      <path d="M0 -58C-24 -58 -40 -40 -40 -18 -40 10 0 40 0 40S40 10 40 -18C40 -40 24 -58 0 -58z" fill="#2b47a0" stroke="#fff" stroke-opacity=".3" stroke-width="2"/>
      <path d="M0 -40C-8 -28 -14 -20 -14 -12A14 14 0 0 0 14 -12C14 -20 8 -28 0 -40z" fill="#cfe0ff"/>
    </g>
    <!-- pins: charging -->
    <g transform="translate(520 180)" filter="url(#sh)">
      <path d="M0 -58C-24 -58 -40 -40 -40 -18 -40 10 0 40 0 40S40 10 40 -18C40 -40 24 -58 0 -58z" fill="url(#accent)" stroke="#fff" stroke-opacity=".3" stroke-width="2"/>
      <path d="M4 -44L-12 -16H0L-4 6 12 -22H0z" fill="#fff"/>
    </g>
    <g transform="translate(200 520)" filter="url(#sh)">
      <path d="M0 -48C-20 -48 -33 -33 -33 -15 -33 8 0 33 0 33S33 8 33 -15C33 -33 20 -48 0 -48z" fill="#2b47a0" stroke="#fff" stroke-opacity=".3" stroke-width="2"/>
      <path d="M0 -34C-7 -24 -11 -17 -11 -10A11 11 0 0 0 11 -10C11 -17 7 -24 0 -34z" fill="#cfe0ff"/>
    </g>

    <!-- phone -->
    <g transform="translate(830 70)" filter="url(#sh)">
      <rect width="300" height="610" rx="42" fill="#0b1029" stroke="#fff" stroke-opacity=".14" stroke-width="2"/>
      <rect x="12" y="12" width="276" height="586" rx="32" fill="#0e1636"/>
      <rect x="110" y="24" width="80" height="20" rx="10" fill="#05070e"/>
      <!-- header -->
      <circle cx="52" cy="84" r="20" fill="url(#accent)"/>
      <path d="M52 72l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#fff"/>
      <text x="82" y="80" fill="#efe9e2" font-size="15" font-weight="700">FindToFill AI</text>
      <text x="82" y="98" fill="#7fd1a0" font-size="11">● online · 5 tools</text>
      <path d="M28 122H272" stroke="#fff" stroke-opacity=".07"/>
      <!-- user bubble -->
      <rect x="92" y="146" width="178" height="62" rx="18" fill="#1f3370"/>
      <text x="108" y="172" fill="#efe9e2" font-size="13">Where can I charge</text>
      <text x="108" y="191" fill="#efe9e2" font-size="13">my phone nearby?</text>
      <!-- bot bubble -->
      <rect x="28" y="228" width="210" height="104" rx="18" fill="#c23a55" fill-opacity=".2" stroke="#e36a82" stroke-opacity=".35"/>
      <text x="44" y="256" fill="#efe9e2" font-size="13">Nearest charging spot:</text>
      <text x="44" y="276" fill="#f3a1b1" font-size="13" font-weight="700">Station C · 240 m</text>
      <text x="44" y="296" fill="#efe9e2" font-size="13">Reported working</text>
      <text x="44" y="316" fill="#98a2ba" font-size="12">12 min ago · with photo</text>
      <!-- report card -->
      <rect x="28" y="352" width="244" height="120" rx="18" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".08"/>
      <rect x="44" y="368" width="64" height="64" rx="12" fill="#1f3370"/>
      <path d="M60 418l12-16 9 11 7-8 12 13z" fill="#7f95d8"/>
      <rect x="120" y="374" width="120" height="9" rx="4.5" fill="#efe9e2" fill-opacity=".8"/>
      <rect x="120" y="392" width="90" height="7" rx="3.5" fill="#98a2ba" fill-opacity=".5"/>
      <rect x="120" y="410" width="66" height="20" rx="10" fill="#7fd1a0" fill-opacity=".2"/>
      <text x="153" y="424" fill="#7fd1a0" font-size="10" font-weight="700" text-anchor="middle">AVAILABLE</text>
      <text x="44" y="456" fill="#98a2ba" font-size="11">Fresh within 7-day window</text>
      <!-- chips -->
      <rect x="28" y="500" width="112" height="34" rx="17" fill="none" stroke="#fff" stroke-opacity=".18"/>
      <text x="84" y="522" fill="#efe9e2" font-size="12" text-anchor="middle">Water refill</text>
      <rect x="150" y="500" width="122" height="34" rx="17" fill="none" stroke="#fff" stroke-opacity=".18"/>
      <text x="211" y="522" fill="#efe9e2" font-size="12" text-anchor="middle">Station layout</text>
      <rect x="28" y="548" width="244" height="36" rx="18" fill="#fff" fill-opacity=".06"/>
      <circle cx="252" cy="566" r="12" fill="url(#accent)"/>
    </g>
  </g>
</svg>
