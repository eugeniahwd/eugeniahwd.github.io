    <linearGradient id="p1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c23a55"/><stop offset="1" stop-color="#3d0a14"/></linearGradient>
    <linearGradient id="p2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b47a0"/><stop offset="1" stop-color="#0b1330"/></linearGradient>
    <linearGradient id="p3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e36a82"/><stop offset="1" stop-color="#1f3370"/></linearGradient>
