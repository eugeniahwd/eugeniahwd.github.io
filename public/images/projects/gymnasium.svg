      <rect width="290" height="330" rx="24" fill="#101a3a" stroke="#fff" stroke-opacity=".1"/>
      <rect width="290" height="64" rx="24" fill="#16244f"/>
      <rect y="40" width="290" height="24" fill="#16244f"/>
      <path d="M36 20l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#e36a82"/>
      <text x="64" y="38" fill="#efe9e2" font-size="15" font-weight="700">AI Draft</text>
      <text x="64" y="54" fill="#98a2ba" font-size="11">persona-aware · safety checked</text>
      <rect x="20" y="86" width="230" height="96" rx="16" fill="#1f3370"/>
      <rect x="36" y="104" width="190" height="8" rx="4" fill="#efe9e2" fill-opacity=".8"/>
      <rect x="36" y="120" width="170" height="8" rx="4" fill="#efe9e2" fill-opacity=".8"/>
      <rect x="36" y="136" width="196" height="8" rx="4" fill="#efe9e2" fill-opacity=".8"/>
      <rect x="36" y="152" width="120" height="8" rx="4" fill="#efe9e2" fill-opacity=".8"/>
      <rect x="20" y="198" width="250" height="40" rx="12" fill="#fff" fill-opacity=".05"/>
      <rect x="36" y="214" width="140" height="8" rx="4" fill="#98a2ba" fill-opacity=".5"/>
      <rect x="20" y="260" width="120" height="46" rx="23" fill="url(#accent)"/>
      <text x="80" y="288" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">Approve</text>
      <rect x="150" y="260" width="120" height="46" rx="23" fill="none" stroke="#fff" stroke-opacity=".2"/>
      <text x="210" y="288" fill="#efe9e2" font-size="14" text-anchor="middle">Edit</text>
