      <!-- header -->
      <text x="210" y="96" fill="#efe9e2" font-size="24" font-weight="700">Follow-up Priority</text>
      <text x="210" y="120" fill="#98a2ba" font-size="13">Sorted by ML classifier · admin approves every message</text>

      <!-- stat cards -->
      <g transform="translate(210 145)">
        <rect width="170" height="92" rx="14" fill="#13214a" fill-opacity=".7" stroke="#fff" stroke-opacity=".06"/>
