          <rect x="62" y="28" width="150" height="9" rx="4.5" fill="#efe9e2" fill-opacity=".85"/>
          <rect x="62" y="44" width="100" height="7" rx="3.5" fill="#98a2ba" fill-opacity=".45"/>
          <rect x="380" y="26" width="72" height="24" rx="12" fill="#c23a55"/>
          <text x="416" y="43" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">HIGH</text>
          <rect x="466" y="30" width="56" height="16" rx="8" fill="#fff" fill-opacity=".08"/>
        </g>
        <path d="M18 76H526" stroke="#fff" stroke-opacity=".05"/>
        <g transform="translate(0 64)">
          <circle cx="34" cy="38" r="16" fill="#8f1d33"/>
          <rect x="62" y="28" width="128" height="9" rx="4.5" fill="#efe9e2" fill-opacity=".85"/>
          <rect x="62" y="44" width="86" height="7" rx="3.5" fill="#98a2ba" fill-opacity=".45"/>
          <rect x="380" y="26" width="72" height="24" rx="12" fill="#c23a55"/>
          <text x="416" y="43" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">HIGH</text>
          <rect x="466" y="30" width="56" height="16" rx="8" fill="#fff" fill-opacity=".08"/>
        </g>
