        <rect width="780" height="560" fill="#0b132b"/>
        <rect width="780" height="48" fill="#111b3d"/>
        <rect y="48" width="180" height="512" fill="#0d1734"/>
      </g>
      <rect width="780" height="560" rx="20" fill="none" stroke="#fff" stroke-opacity=".08"/>
      <circle cx="26" cy="24" r="6" fill="#e36a82"/>
      <circle cx="46" cy="24" r="6" fill="#8f1d33"/>
      <circle cx="66" cy="24" r="6" fill="#2b47a0"/>
      <rect x="290" y="14" width="200" height="20" rx="10" fill="#0b132b"/>

      <!-- sidebar -->
      <rect x="22" y="72" width="32" height="32" rx="9" fill="url(#accent)"/>
      <rect x="64" y="78" width="80" height="9" rx="4.5" fill="#efe9e2" fill-opacity=".85"/>
      <rect x="64" y="93" width="54" height="7" rx="3.5" fill="#98a2ba" fill-opacity=".5"/>
      <rect x="14" y="136" width="152" height="40" rx="10" fill="#c23a55" fill-opacity=".18"/>
      <rect x="28" y="150" width="14" height="14" rx="4" fill="#e36a82"/>
      <rect x="52" y="153" width="76" height="8" rx="4" fill="#efe9e2" fill-opacity=".9"/>
      <g fill="#98a2ba" fill-opacity=".35">
        <rect x="28" y="198" width="14" height="14" rx="4"/><rect x="52" y="201" width="64" height="8" rx="4"/>
        <rect x="28" y="238" width="14" height="14" rx="4"/><rect x="52" y="241" width="84" height="8" rx="4"/>
        <rect x="28" y="278" width="14" height="14" rx="4"/><rect x="52" y="281" width="56" height="8" rx="4"/>
        <rect x="28" y="318" width="14" height="14" rx="4"/><rect x="52" y="321" width="72" height="8" rx="4"/>
