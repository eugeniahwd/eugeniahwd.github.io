        <g transform="translate(0 128)">
          <circle cx="34" cy="38" r="16" fill="#5b6fb8"/>
          <rect x="62" y="28" width="164" height="9" rx="4.5" fill="#efe9e2" fill-opacity=".85"/>
          <rect x="62" y="44" width="110" height="7" rx="3.5" fill="#98a2ba" fill-opacity=".45"/>
          <rect x="380" y="26" width="72" height="24" rx="12" fill="#e36a82" fill-opacity=".25"/>
          <text x="416" y="43" fill="#f3a1b1" font-size="11" font-weight="700" text-anchor="middle">MED</text>
          <rect x="466" y="30" width="56" height="16" rx="8" fill="#fff" fill-opacity=".08"/>
        </g>
        <path d="M18 204H526" stroke="#fff" stroke-opacity=".05"/>
        <g transform="translate(0 192)">
          <circle cx="34" cy="38" r="16" fill="#1f3370"/>
          <rect x="62" y="28" width="118" height="9" rx="4.5" fill="#efe9e2" fill-opacity=".85"/>
          <rect x="62" y="44" width="80" height="7" rx="3.5" fill="#98a2ba" fill-opacity=".45"/>
          <rect x="380" y="26" width="72" height="24" rx="12" fill="#7f95d8" fill-opacity=".2"/>
          <text x="416" y="43" fill="#aebde9" font-size="11" font-weight="700" text-anchor="middle">LOW</text>
          <rect x="466" y="30" width="56" height="16" rx="8" fill="#fff" fill-opacity=".08"/>
        </g>
