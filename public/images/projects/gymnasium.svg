<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1736"/>
      <stop offset=".6" stop-color="#090e21"/>
      <stop offset="1" stop-color="#1B263B"/>
    </linearGradient>
    <radialGradient id="g1" cx=".88" cy=".08" r=".55">
      <stop offset="0" stop-color="#415A77" stop-opacity=".5"/>
      <stop offset="1" stop-color="#415A77" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx=".05" cy=".95" r=".5">
      <stop offset="0" stop-color="#2b47a0" stop-opacity=".5"/>
      <stop offset="1" stop-color="#2b47a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e36a82"/>
      <stop offset="1" stop-color="#7a1428"/>
    </linearGradient>
    <clipPath id="win"><rect width="780" height="560" rx="20"/></clipPath>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#g1)"/>
  <rect width="1200" height="750" fill="url(#g2)"/>
  <g stroke="#ffffff" stroke-opacity=".035">
    <path d="M0 125H1200M0 250H1200M0 375H1200M0 500H1200M0 625H1200"/>
    <path d="M150 0V750M300 0V750M450 0V750M600 0V750M750 0V750M900 0V750M1050 0V750"/>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
